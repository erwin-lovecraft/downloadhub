[package]
name = "downloadhub-transcode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audio transcoding for downloadhub via an external ffmpeg binary (bundled as a Tauri sidecar)."

[lib]
name = "downloadhub_transcode"

[dependencies]
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["process"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "fs"] }
