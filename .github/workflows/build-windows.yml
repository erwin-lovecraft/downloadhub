name: build-windows

# Builds a single Windows installer that bundles both the desktop app and
# the mcp-server sidecar (`pnpm package` builds the sidecar into
# src-tauri/binaries/ first, then `tauri build` embeds it). Run manually or
# on a version tag; the installer is uploaded as a workflow artifact.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      # Builds the mcp-server sidecar, then the Tauri app installer with the
      # sidecar bundled inside it (one .msi / .exe ships both).
      - run: pnpm package

      - uses: actions/upload-artifact@v4
        with:
          name: downloadhub-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
