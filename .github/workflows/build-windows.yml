name: build-windows

# Builds a single Windows installer that bundles both the desktop app and
# the mcp-server sidecar (`npm run package` builds the sidecar into
# src-tauri/binaries/ first, then `tauri build` embeds it). Run manually or
# on a version tag; the installer is uploaded as a workflow artifact.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm install

      # Builds the mcp-server sidecar, then the Tauri app installer with the
      # sidecar bundled inside it (one .msi / .exe ships both). The three
      # credentials are read at compile time by `option_env!` (see
      # core::secrets) and baked into the binaries, so the shipped installer
      # needs no .env. Set them as repository secrets in GitHub
      # (Settings -> Secrets and variables -> Actions).
      - run: npm run package
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: downloadhub-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
