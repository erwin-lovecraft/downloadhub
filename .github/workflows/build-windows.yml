name: build-windows

# Builds a Windows installer bundling the desktop app and the mcp-server
# sidecar, then publishes it as a GitHub Release.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: extractions/setup-just@v4

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Cache the pnpm store (content-addressed) instead of node_modules, so
      # a lockfile change only fetches the delta instead of missing entirely.
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The two TAURI_SIGNING_* vars make `tauri build` sign the installer and
      # emit a `.sig` next to it; the updater plugin refuses unsigned updates.
      - run: just release
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Build the updater manifest the app polls. The .sig is the signature the
      # installer was signed with; the url points at this tag's release asset.
      - name: Generate latest.json
        shell: bash
        run: |
          sig_file=$(ls target/release/bundle/nsis/*-setup.exe.sig)
          exe_name=$(basename "${sig_file%.sig}")
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$sig_file")" \
            --arg url "https://github.com/erwin-lovecraft/downloadhub/releases/download/${GITHUB_REF_NAME}/${exe_name}" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > latest.json

      - uses: actions/upload-artifact@v6
        with:
          name: downloadhub-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            latest.json
          fail_on_unmatched_files: true
