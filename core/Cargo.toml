[package]
name = "downloadhub-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure business logic for downloadhub: YouTube Data API client, y7dl wrapper, queue manager, download orchestrator, and persistence. No Tauri dependency."

[lib]
name = "downloadhub_core"

[dependencies]
keyring = { version = "4.1.4", features = ["v1"] }
oauth2 = { version = "5.0.0", features = ["reqwest"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs"] }
url = "2.5.8"
y7dl = { git = "https://github.com/erwin-lovecraft/y7dl", rev = "a581b51794a0a0b388f4d2a3248ecd081d2fc615" }
