[package]
name = "downloadhub-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure business logic for downloadhub: YouTube Data API client, y7dl wrapper, queue manager, download orchestrator, and persistence. No Tauri dependency."

[lib]
name = "downloadhub_core"

[dependencies]
keyring = { version = "4.1.4", features = ["v1"] }
oauth2 = { version = "5.0.0", features = ["reqwest"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
url = "2.5.8"
