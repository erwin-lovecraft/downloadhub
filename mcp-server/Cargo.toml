[package]
name = "downloadhub-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP server letting external AI agents search YouTube and fill the download queue. Exposes no tool that can start a download — only the user can, from the desktop app."

[[bin]]
name = "mcp-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
dotenvy = "0.15.7"
downloadhub-core = { path = "../core" }
downloadhub-ytdlp = { path = "../ytdlp" }
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io"] }
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
