[package]
name = "downloadhub"
version.workspace = true
description = "An AI-powered YouTube downloader desktop app: log in with Google, search YouTube, build a download queue (video + format + quality), and download videos"
authors = ["erwin-lovecraft"]
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "downloadhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
downloadhub-core = { path = "../core" }
dotenvy = "0.15.7"
tauri-plugin-dialog = "2.7.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
