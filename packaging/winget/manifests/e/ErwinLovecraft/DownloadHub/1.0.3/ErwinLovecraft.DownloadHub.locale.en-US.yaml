ShortDescription: An AI-powered YouTube downloader desktop app with search, a download queue, and MCP-based AI agent access.
Description: >-
  DownloadHub is a desktop app for searching YouTube, building a download
  queue (video + format + quality), and downloading videos in chunked,
  resumable-friendly requests. It also bundles an MCP server so external AI
  agents (Claude Desktop, Claude Code, Gemini CLI, Codex CLI, and others) can
  propose playlists and queue downloads, subject to explicit approval in the
  running app before anything executes.
